[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sei-bd-agent"
version = "0.1.0"
description = "SEI Chicago BD Signal Agent (prototype)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx2>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ui = ["jinja2>=3.1"]
dev = ["pytest>=8.0", "jinja2>=3.1"]

[project.scripts]
bd = "bd.cli:app"

[tool.setuptools.packages.find]
include = ["bd*"]

[tool.setuptools.package-data]
bd = ["prompts/*.md", "ui/templates/*.html", "ui/templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
