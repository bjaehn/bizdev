# All weights, thresholds, counties, size floors and exclusions live here.
# Secrets and the model name come from env vars only (see .env.example).

scoring:
  # Base points by signal type.
  base_points:
    leadership_change: 30
    leadership_transformation_ai_data: 25
    open_exec_search: 20
    pe_platform_or_sponsor_exec: 28
    pe_addon: 22
    pe_hold_2_4: 0          # was 12. How long a sponsor has held a company is not evidence of a need (and a holding period from an announcement date is not a closing date), so it no longer scores; stored rows stay and score 0
    restructuring_layoffs: 24
    ma_divestiture: 24
    activist: 18
    ops_failure: 18
    cost_program: 18
    ai_commitment: 16
    strategy_rebrand: 14
    hiring_cluster: 26      # 3+ related postings in 60 days
    hiring_leadership: 30   # a VP-or-above role posted in a relevant area (AI, data, transformation, strategy/ops, product)
    hiring_interim: 18
    hiring_single: 12
    platform_migration: 20
    vendor_deal: 14
    rfp_match: 30
    risk_factor: 8
    financial_pressure: 14  # from the company's own latest 10-K figures (revenue down, margin down, or an operating loss)

  # Which family each type belongs to.
  families:
    leadership: [leadership_change, leadership_transformation_ai_data, open_exec_search]
    hiring: [hiring_cluster, hiring_leadership, hiring_interim, hiring_single]
    events: [restructuring_layoffs, ma_divestiture, activist, ops_failure, cost_program, ai_commitment, strategy_rebrand]
    pe: [pe_platform_or_sponsor_exec, pe_addon, pe_hold_2_4]
    technology: [platform_migration, vendor_deal]
    procurement: [rfp_match]
    filings: [risk_factor]
    financials: [financial_pressure]

  # Recency by event age in days (inclusive upper bound). Older than the last band = 0.
  recency_bands:
    - {max_days: 30, multiplier: 1.0}
    - {max_days: 90, multiplier: 0.7}
    - {max_days: 180, multiplier: 0.4}
  # Status types are not events: flat multiplier regardless of event_date.
  status_types: [pe_hold_2_4]
  status_multiplier: 0.7

  # Low is stored but never scored (multiplier 0 and excluded before family grouping).
  confidence_multiplier: {High: 1.0, Medium: 0.7, Low: 0.0}
  service_match_multiplier: {match: 1.0, none: 0.5}

  # Order matters: a signal of one kind followed, within `within_days`, by a signal of another is a stronger sign than the two
  # alone (for example a new executive and then a hiring push). A pattern adds its bonus once, however many pairs match; both
  # signals must themselves score (High/Medium confidence, inside the recency bands). Patterns are added to the score after the
  # stacking bonus, capped together at sequence_bonus_max, and shown on the opportunity.
  # OFF by default (empty list) because turning it on changes scores, including the three reference accounts in the spec (the
  # first would go from 91 to 99). To try it, replace `sequences: []` with the patterns below (starting values; tune them).
  sequence_bonus_max: 15
  sequences: []
  #  - {name: new_leader_then_hiring, label: "New leader, then hiring", first: [leadership_change, leadership_transformation_ai_data],
  #     then: [hiring_cluster, hiring_leadership, hiring_interim], within_days: 120, bonus: 8}
  #  - {name: pressure_then_leadership, label: "Pressure, then leadership change", first: [restructuring_layoffs, cost_program, ma_divestiture, financial_pressure, activist],
  #     then: [leadership_change, open_exec_search, leadership_transformation_ai_data], within_days: 120, bonus: 8}
  #  - {name: technology_then_hiring, label: "Technology commitment, then hiring", first: [platform_migration, vendor_deal, ai_commitment, rfp_match],
  #     then: [hiring_cluster, hiring_leadership], within_days: 120, bonus: 6}
  #  - {name: strategy_then_leader, label: "Strategy shift, then new leader", first: [strategy_rebrand],
  #     then: [leadership_change, leadership_transformation_ai_data], within_days: 120, bonus: 6}

  # Within a family: strongest counts in full, each further signal at this fraction.
  within_family_decay: 0.5
  # Stacking bonus per family beyond the first, capped.
  stacking_bonus_per_family: 10
  stacking_bonus_max: 30
  score_max: 100

  bands:
    hot: 75
    warm: 60
    watch: 40
  # Bands that are posted to Teams.
  posted_bands: [Hot, Warm]

  # Sponsor activity: events at a private equity firm lift the score of its current portfolio companies. A lift is
  # added only to a company that already has its own scoring signal, it is capped, and it is shown separately.
  sponsor:
    base_points: {firm_new_fund: 8, firm_exit: 6, firm_operating_partner: 8}
    lift_max: 10

post_gate:
  require_high_confidence_within_days: 90
  max_leads_per_post: 10
  cooldown_weeks: 4
  cooldown_break_score_rise: 15   # or a new family appearing

service_lines:
  - AI & Technology
  - Data & Analytics
  - Strategy & Operations
  - Concept to Delivery

fit_gate:
  counties: [Cook, DuPage, Lake, Will, Kane, McHenry]
  state: IL
  size_floor:
    default: {revenue_usd: 250000000, employees: 1000}   # either threshold passes
    pe-backed: {revenue_usd: 75000000, employees: null}
  excluded_industries: [cannabis]
  exclusion_reasons: [client, do_not_pursue, cannabis, conflict]

scan:
  window_days: 180
  cadence_grace_days: 1   # a weekly account is due again after 7 - 1 days, so a slightly early run is not skipped
  # Status-type signals describe a condition, not an event: they are valid while the condition holds.
  # pe_hold_2_4: the sponsor bought the company between 2 and 4 years ago (days, inclusive).
  status_type_age_days:
    pe_hold_2_4: [730, 1461]
  max_future_days: 30   # event_date later than run date + this is rejected as implausible
  # A company already scanned that shows no signal in quiet_days days is checked every quiet_every_weeks weeks instead of its tier's cadence
  # (most companies are quiet most weeks, and each check costs real money). A company that shows a signal goes back to its tier's cadence; 0 turns this off.
  quiet_days: 60
  quiet_every_weeks: 4
  tiers:
    A: {every_weeks: 1, max_searches: 6}     # deeper search for the accounts that matter most
    B: {every_weeks: 2, max_searches: 3}

llm:
  max_tokens: 16000
  web_search_max_uses: 4          # web searches per model call (a scan tier can override: scan.tiers.*.max_searches)
  web_search_tool_type: web_search_20260209   # check Anthropic docs if the model changes
  max_continuations: 5            # pause_turn resumes per call
  json_retries: 1                 # one retry on invalid JSON
  concurrency: 4                  # max simultaneous scanner calls
  call_reserve_usd: 0.35          # expected cost of one search call; the limit counts calls in flight (bd/budget.py)
  max_cost_per_run_usd: 10.0      # soft cap: stop starting new calls once estimated spend reaches this

# USD per million tokens. Source: https://platform.claude.com/docs/en/about-claude/pricing
# (retrieved 2026-10-15). A model missing here is logged as unpriced (NULL), never guessed.
# Search results are billed as input tokens; code execution is free alongside web search.
pricing:
  retrieved: 2026-10-15
  web_search_per_1000: 10.0
  models:
    claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_write_5m: 2.5, cache_read: 0.10}
    claude-sonnet-5: {input: 2.0, output: 10.0, cache_write_5m: 2.5, cache_read: 0.20}
    claude-opus-5-5: {input: 4.0, output: 20.0, cache_write_5m: 5.0, cache_read: 0.20}
    claude-opus-5: {input: 5.0, output: 25.0, cache_write_5m: 6.25, cache_read: 0.50}
    claude-fable-5-1: {input: 10.0, output: 50.0, cache_write_5m: 12.5, cache_read: 0.25}
    # Haiku 5.5 is priced by prompt length: a request whose prompt is over 100,000 tokens pays the long_* rates (each request on its own).
    claude-haiku-5-5: {input: 0.10, output: 0.50, cache_write_5m: 0.125, cache_read: 0.01, long_over_tokens: 100000, long_input: 0.50, long_output: 2.50, long_cache_write_5m: 0.625, long_cache_read: 0.05}

verify:
  timeout_seconds: 15
  max_redirects: 5
  block_private_addresses: true

sources:
  # Never searched, never fetched, never accepted as a source_url.
  # No LinkedIn; paywalled sites. Starter list - edit as needed.
  blocked_domains:
    - linkedin.com
    - wsj.com
    - ft.com
    - bloomberg.com
    - barrons.com
    - nytimes.com
    - economist.com
    - theinformation.com
    - crainschicago.com
    - chicagobusiness.com
    # Job boards that restrict automated access (company careers pages and ATS pages are used instead).
    - indeed.com
    - glassdoor.com
    - ziprecruiter.com
  wire_services: [businesswire.com, prnewswire.com, globenewswire.com]
  # Applicant-tracking systems that host a company's own job postings: count as the company's own site.
  ats_domains: [greenhouse.io, lever.co, myworkdayjobs.com, icims.com, smartrecruiters.com, ashbyhq.com, jobvite.com, taleo.net]
  sec_domains: [sec.gov]
  warn_domains: [illinois.gov]
  # Highest confidence a source type can earn. The model's own claim can only lower it.
  confidence_by_source_type:
    company_release: High
    sec_filing: High
    warn_notice: High
    company_site: High
    secondary_report: Medium
    rumor: Low

hiring:
  window_days: 60               # a posting must be dated within this many days of the run
  cluster_min: 3                # hiring_cluster = this many related postings
  senior_levels: [c_suite, svp_vp, director]
  leadership_levels: [c_suite, svp_vp]   # a posting at these levels is a hiring_leadership signal
  # Posting theme -> service lines (code, not the model, assigns these).
  theme_service_lines:
    ai_technology: [AI & Technology]
    data_analytics: [Data & Analytics]
    strategy_operations: [Strategy & Operations]
    transformation_change: [Strategy & Operations]
    product_engineering: [Concept to Delivery]
  # Used only by the `ats` scanner, which reads a company's own job board directly: a posting counts toward a theme
  # when its TITLE contains one of the phrases (whole words, any case). First theme in this order that matches wins;
  # a title that matches none is ignored. The model-based `hiring` scanner assigns themes itself.
  theme_keywords:
    data_analytics: [data engineer, data scientist, data analyst, data architect, data platform, data governance, data science, analytics, business intelligence, chief data, head of data]
    ai_technology: [machine learning, artificial intelligence, ai, generative ai, llm, mlops, ml engineer, chief technology, chief information, cio, cto, enterprise architect, cloud architect, it strategy, digital technology]
    transformation_change: [transformation, pmo, program management, portfolio management, change management, business excellence, operational excellence, continuous improvement, integration management]
    strategy_operations: [strategy, chief operating, coo, chief of staff, corporate development, business operations, operations excellence, operating model]
    product_engineering: [product manager, product management, head of product, vp product, chief product, digital product, platform engineer, software engineer, engineering manager]
  # product_engineering is noisy (every large company hires engineers), so its titles must also contain one of these.
  theme_title_gates:
    product_engineering: [manager, director, head, vp, vice president, chief, principal, staff, lead, architect]
  interim_words: [interim, fractional, contract executive]

# Financial pressure, read from the SEC's structured data for the company's latest 10-K (no model call, so no cost).
# A signal needs at least one of these to hold; each compares the latest fiscal year with the one before it.
financials:
  revenue_decline_pct: 3.0      # revenue fell by at least this much
  margin_drop_points: 3.0       # operating margin fell by at least this many percentage points
  flag_operating_loss: true     # operating income was negative

# `bd sec-fill` (the first free step of Update my list): for companies that file with the SEC, read size, public ownership and
# headquarters from the SEC's own data, and find a missing CIK by an exact name match in the SEC's list of listed companies. No model.
sec_fill:
  max_accounts_per_run: 60      # SEC records read per run (about two requests each, spaced by edgar.min_interval_seconds)

# Signals read straight from SEC 8-K item codes (no model, so no cost). The SEC says which items a filing reports; code dates the
# signal by the filing's report date, fetches the filing and requires the item heading in it, and writes the summary from the label
# below. Each item maps to one signal type and the service lines it points to.
sec_events:
  max_filings_per_scan: 6
  items:
    "2.05": {type: restructuring_layoffs, label: "costs associated with exit or disposal activities", service_lines: [Strategy & Operations]}
    "2.01": {type: ma_divestiture, label: "completion of an acquisition or disposition of assets", service_lines: [Strategy & Operations]}

# Open public RFPs / RFQs / RFIs from Chicago-area agencies. One search per group, restricted to that group's own domains, so
# every result is an official page. Not tied to a company and never scored; shown on the Open RFPs page.
rfps:
  max_searches: 4
  max_due_days: 365
  groups:
    - {name: City of Chicago, domains: [chicago.gov]}
    - {name: Cook County, domains: [cookcountyil.gov, cookcountyhealth.org]}
    - {name: State of Illinois, domains: [illinois.gov]}
    - {name: Schools and universities, domains: [cps.edu, uic.edu, uillinois.edu]}
    - {name: Transit and water agencies, domains: [transitchicago.com, metrarail.com, rtachicago.org, pacebus.com, mwrd.org]}
    - {name: Federal, domains: [sam.gov]}

# Plain-English questions about your own data (the Ask page). Two small model calls, no web access: one writes a read-only query,
# one phrases the answer from the rows it returned.
ask:
  max_rows: 200
  max_question_chars: 500
  timeout_seconds: 5
  max_cost_usd: 0.50

edgar:
  min_interval_seconds: 0.15      # SEC fair access allows 10 requests/second; stay well under
  max_filings_per_scan: 5         # newest 8-K Item 5.02 filings read per account
  max_chars: 8000                 # filing text sent to Claude per filing
  timeout_seconds: 20

briefer:
  max_words: 30                   # why_now is ONE sentence of at most this many words
  max_signals_in_prompt: 4
  # why_now is rejected (retried once, then replaced by a plain fallback) if it contains any of these.
  banned_phrases: [reach out, outreach, we should, pitch, approach, recommend, SEI, opportunity to sell, cold call]

card:
  max_bytes: 28000                # Teams adaptive card payloads are limited to about 28 KB
  max_buttons_per_lead: 3
  title: SEI Chicago BD Signals

# Market research: `bd discover` finds Chicagoland companies by segment, researches their facts with the same
# verified-evidence rules as `bd enrich`, auto-adds those that clear the fit gate, and queues the rest for a person.
discovery:
  per_segment: 8
  max_candidates_per_run: 30
  max_auto_add_per_run: 15
  scan_unreviewed_per_run: 25     # new auto-added companies scanned per run before a person marks them reviewed (same size as one update)
  segments:
    - manufacturing and industrial products
    - food, beverage and consumer packaged goods
    - healthcare services, health systems and life sciences
    - banking, insurance and asset management
    - logistics, transportation and distribution
    - business and professional services
    - technology, software and data companies
    - retail, e-commerce and hospitality
    - energy, utilities, chemicals and materials
    - construction, engineering and real estate
    - education, nonprofits and associations
    - media, marketing and telecommunications

# Private equity firms: derived from accounts that have a sponsor; `bd pe-portfolio` finds their other Chicagoland
# companies, `bd pe-signals` looks for firm-level news (new fund, operating-partner hire, exit).
pe_firms:
  max_firms_per_run: 25
  portfolio_max_per_firm: 25

# PE portfolio intelligence (bd pe-collect): reads each firm's own portfolio page, keeps every relationship with its evidence and dates.
pe_portfolio:
  fetch:
    timeout_seconds: 20
    max_retries: 2
    retry_backoff_seconds: 2
    min_seconds_between_requests: 2      # per host
    max_bytes: 2000000
    max_pages_per_source: 12             # pages of one listing (pagination, "next" links, public site API pages)
    respect_robots: true
    user_agent_suffix: "bd-portfolio-reader"
    cache_hours: 6
  ownership_fresh_days: 120              # shown as stale after this, never silently changed
  listing_fresh_days: 45
  pending_window_days: 270               # announced and not shown as completed: "pending" this long, then "unclear"
  snapshot_keep: 5
  text_cap_bytes: 400000
  # Geography follows fit_gate (state and counties). A company's city is not mapped to a county by this code; if you want cities inside
  # the state counted as in scope without fact research, list them here. Empty means not configured, and the page says so.
  scope_cities: []
  locate_per_run: 25                     # free: reads a company's own site for an address shown on it
  deal_window_days: 730                  # transaction research (paid): deals dated this far back
  deals_max_per_firm: 10
  research_unresolved: 0                 # paid fact research of portfolio companies whose HQ the listing does not show (0 = off; set a cap to enable)

# Evidence-based priority (bd/opportunity_model.py). Deterministic: structured evidence in, a breakdown out. Priority is NOT the Hot/Warm/Watch score above
# and is NOT a probability of purchase or win. Confidence (how well the hypothesis is supported) is reported separately.
opportunity_model:
  weights: {need: 30, timing: 25, investment: 20, external_help: 15, evidence_quality: 10}   # must total 100
  second_event_credit: 0.2         # a dimension is its best distinct event plus this fraction of the next best one
  event_cluster_days: 7            # evidence about the same kind of event within this many days is one event, however many sources repeat it
  # How specifically the evidence establishes a business need, 0-100. 100 = an explicit, scoped program with a named owner; 75 = a specific initiative
  # (system, scope or program named); 50 = a defined event that usually brings a category of work; 25 = a generic indicator; 10 = context only.
  # A kind that is absent says nothing about the dimension (unknown), which is not the same as 0.
  need:
    rfp_match: 90
    platform_migration: 75
    leadership_transformation_ai_data: 70
    ai_commitment: 60
    cost_program: 60
    ma_divestiture: 55
    ops_failure: 55
    vendor_deal: 50
    restructuring_layoffs: 45
    hiring_interim: 45
    add_on_completed: 45
    leadership_change: 40
    hiring_leadership: 40
    pe_addon: 40
    financial_pressure: 35
    activist: 35
    deal_completed: 30          # a completed acquisition is a research trigger, not proof of a need
    open_exec_search: 30
    strategy_rebrand: 30
    add_on_announced: 25
    hiring_cluster: 25
    pe_platform_or_sponsor_exec: 20
    deal_announced: 15
    risk_factor: 15
    hiring_single: 10
  # Evidence that money or procurement effort is committed, 0-100: 90 = an open solicitation; 70 = a named vendor deal; 55 = a stated program or capital
  # deployed; 35 = effort implied (a leadership hire, a hiring push); unknown when the kind says nothing about spend.
  investment:
    rfp_match: 90
    vendor_deal: 70
    platform_migration: 55
    deal_completed: 55
    add_on_completed: 55
    pe_addon: 55
    ai_commitment: 50
    pe_platform_or_sponsor_exec: 45
    hiring_leadership: 40
    cost_program: 35
    hiring_interim: 35
    hiring_cluster: 30
  # How likely the situation is to involve outside help, 0-100: 100 = a solicitation for outside services; 75 = interim or temporary capacity;
  # 60 = a transition that usually needs capacity the company lacks; 40 = ambiguous; 20 = building in-house capacity.
  external_help:
    rfp_match: 100
    hiring_interim: 75
    ma_divestiture: 60
    platform_migration: 60
    add_on_completed: 55
    vendor_deal: 55
    leadership_transformation_ai_data: 55
    ops_failure: 50
    deal_completed: 45
    ai_commitment: 45
    cost_program: 45
    activist: 45
    pe_addon: 45
    financial_pressure: 40
    restructuring_layoffs: 40
    pe_platform_or_sponsor_exec: 40
    leadership_change: 35
    hiring_leadership: 35
    strategy_rebrand: 30
    open_exec_search: 25
    add_on_announced: 25
    hiring_cluster: 20
  # Timing from the age of the event the source states (the first band whose max_days covers it). Older than the last band = 0. An unknown date is unknown.
  recency:
    - {max_days: 30, points: 85}
    - {max_days: 90, points: 65}
    - {max_days: 180, points: 40}
    - {max_days: 365, points: 15}
  # An explicit stated expected closing in the future, in days from today, is a stated milestone.
  milestone:
    - {within_days: 90, points: 100}
    - {within_days: 180, points: 80}
  # Evidence quality of one item, 0-100, by the kind of source; a date the source does not state caps it.
  quality:
    sec_filing: 100
    company_release: 90
    firm_site: 90
    company_site: 90
    warn_notice: 90
    secondary_report: 55
    search_snippet: 0
    rumor: 0
  unknown_date_quality_cap: 50
  corroboration_bonus: 10          # the same event reported by a second, independent source domain
  # Confidence in the hypothesis (separate from priority): the best supporting item's quality, plus corroboration, minus gaps.
  confidence:
    high: 80
    medium: 55
    corroboration_per_extra_event: 15      # distinct events pointing at the same consulting category (max two)
    specific_need_bonus: 10                # the best item's need anchor is at least 75
    unknown_date_penalty: 20
    unverified_ownership_penalty: 25       # a deal item whose ownership status is unclear, conflicting or stale
  # Action categories, evaluated in this order; the first whose conditions all hold wins. Every number is a threshold you can change.
  categories:
    prospect_now:    {min_score: 50, min_need: 50, min_timing: 60, min_confidence: Medium, min_known_dimensions: 3, min_source_quality: 70}
    validate_first:  {min_score: 30, min_need: 40, min_timing: 40}
    nurture:         {min_need: 40}
    monitor:         {min_score: 10}
  # Signal kinds that count against a hypothesis. Each is evidence of a canceled program or a spending restriction.
  counter_kinds: [program_canceled, spending_restriction]
  counter_need_factor: 0.4         # when a counter signal is as new as the best supporting event or newer, that need is multiplied by this
  # What a kind suggests, as general consulting categories (a hypothesis, never a finding).
  consulting_categories:
    platform_migration: [Technology implementation and integration]
    vendor_deal: [Technology implementation and integration]
    rfp_match: [Program and change management]
    leadership_transformation_ai_data: [AI implementation and adoption, Data and analytics]
    ai_commitment: [AI implementation and adoption]
    leadership_change: [Program and change management]
    open_exec_search: [Program and change management]
    restructuring_layoffs: [Operating model and process improvement]
    cost_program: [Operating model and process improvement]
    ops_failure: [Operating model and process improvement, Customer experience and service operations]
    activist: [Operating model and process improvement]
    financial_pressure: [Operating model and process improvement]
    strategy_rebrand: [Product strategy and delivery]
    ma_divestiture: [Acquisition integration and separation]
    pe_addon: [Acquisition integration and separation]
    add_on_completed: [Acquisition integration and separation]
    add_on_announced: [Acquisition integration and separation]
    deal_completed: [Acquisition integration and separation, Operating model and process improvement]
    deal_announced: [Acquisition integration and separation]
    pe_platform_or_sponsor_exec: [Operating model and process improvement]
  # Hiring signals name their area in the summary; it picks the category.
  hiring_theme_categories:
    "AI and technology": AI implementation and adoption
    "data and analytics": Data and analytics
    "strategy and operations": Operating model and process improvement
    "transformation and change": Program and change management
    "product and engineering": Product strategy and delivery
  # The function that would own work in a category, as an inference from the category (never a verified buyer).
  owner_function:
    Technology implementation and integration: technology or IT leadership
    Data and analytics: data or analytics leadership
    AI implementation and adoption: technology, data or AI leadership
    Customer experience and service operations: customer or service operations leadership
    Product strategy and delivery: product leadership
    Operating model and process improvement: operations leadership or the CFO
    Acquisition integration and separation: the CEO, CFO or integration lead
    Program and change management: a transformation or program office, or the COO
